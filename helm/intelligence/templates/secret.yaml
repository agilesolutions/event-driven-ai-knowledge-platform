{{- if .Values.database.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.secret.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "intelligence.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.database.secret.username | quote }}
  password: {{ .Values.database.secret.password | quote }}
  apikey: {{ .Values.ai.apiKey | quote }}
{{- end }}