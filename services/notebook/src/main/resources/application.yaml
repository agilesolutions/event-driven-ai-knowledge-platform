spring:

  application:
    name: notebook

  datasource:
    url: ${SPRING_DATASOURCE_URI:jdbc:postgresql://notebook-postgresql.database.svc.cluster.local:5432/notebook}
    username: ${SPRING_DATASOURCE_USERNAME:notebook}
    password: ${SPRING_DATASOURCE_PASSWORD:notebook}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true  # Necessary if the database already has tables
    locations:
      - classpath:db/migration
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.kafka-dev.svc.cluster.local:9093}

    properties:
      schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL:http://kafka.kafka-dev.svc.cluster.local:8081}

app:
  kafka:
    topics:
      notebook-events: notebook.events

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}

  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/logs}
    tracing:
      export:
        # Note: OpenTelemetry native tracing uses 'endpoint' under 'opentelemetry'
        endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/traces}

  otlp:
    metrics:
      export:
        # Crucial: Use the correct Micrometer target property path
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/metrics}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.springframework.boot.jdbc.autoconfigure: DEBUG
    org.springframework.boot.hibernate.autoconfigure: DEBUG