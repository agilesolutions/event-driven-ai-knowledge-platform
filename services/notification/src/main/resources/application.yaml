spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: kafka.kafka-dev.svc.cluster.local:9093

    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer

      properties:
        schema.registry.url: http://kafka.kafka-dev.svc.cluster.local:8081
        specific.avro.reader: true

    listener:
      ack-mode: record

app:
  kafka:
    topics:
      notebook-events: notebook.events

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}

  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/logs}
    tracing:
      export:
        # Note: OpenTelemetry native tracing uses 'endpoint' under 'opentelemetry'
        endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/traces}

  otlp:
    metrics:
      export:
        # Crucial: Use the correct Micrometer target property path
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://alloy.monitoring.svc.cluster.local:4318/v1/metrics}

logging:
  level:
    com.agilesolutions.notification: INFO
    org.apache.kafka: WARN